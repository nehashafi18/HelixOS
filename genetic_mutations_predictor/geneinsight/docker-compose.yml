version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: geneinsight
      POSTGRES_USER: geneinsight
      POSTGRES_PASSWORD: geneinsight
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geneinsight"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://geneinsight:geneinsight@postgres:5432/geneinsight
      SECRET_KEY: supersecretkey-changeme-in-production
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MODEL_DIR: /app/models
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../model.pkl:/app/models/model.pkl:ro
      - ../gene_encoder.pkl:/app/models/gene_encoder.pkl:ro
      - ../type_encoder.pkl:/app/models/type_encoder.pkl:ro
      - ../origin_encoder.pkl:/app/models/origin_encoder.pkl:ro

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    environment:
      - NODE_ENV=production

volumes:
  postgres_data:
